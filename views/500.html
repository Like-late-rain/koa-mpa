<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .error-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: calc(100vh - 200px);
        }

        .error-container {
            text-align: center;
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .error-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 20px rgba(231, 76, 60, 0.3));
        }

        .error-code {
            font-size: 100px;
            font-weight: 900;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(231, 76, 60, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        .error-title {
            font-size: 32px;
            color: #2c3e50;
            margin: 20px 0;
            font-weight: 700;
        }

        .error-description {
            font-size: 16px;
            color: #546e7a;
            margin: 20px 0;
            line-height: 1.8;
        }

        .error-details {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 8px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        .error-details-title {
            font-size: 14px;
            font-weight: 600;
            color: #856404;
            margin-bottom: 8px;
        }

        .error-details-content {
            font-size: 13px;
            color: #856404;
            font-family: 'Courier New', monospace;
            word-break: break-word;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            box-shadow: 0 4px 15px rgba(149, 165, 166, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(149, 165, 166, 0.6);
        }

        .decorative-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float-dot 6s ease-in-out infinite;
        }

        .dot:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .dot:nth-child(2) { top: 20%; left: 80%; animation-delay: 1s; }
        .dot:nth-child(3) { top: 70%; left: 20%; animation-delay: 2s; }
        .dot:nth-child(4) { top: 80%; left: 90%; animation-delay: 3s; }

        @keyframes float-dot {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 40px 30px;
            }
            .error-code {
                font-size: 80px;
            }
            .error-title {
                font-size: 24px;
            }
            .error-icon {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="decorative-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="error-page">
        <div class="error-container">
            <div class="error-icon">
                <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="60" cy="60" r="50" fill="#e74c3c" opacity="0.1"/>
                    <circle cx="60" cy="60" r="40" fill="#e74c3c" opacity="0.2"/>
                    <path d="M60 20C37.9 20 20 37.9 20 60s17.9 40 40 40 40-17.9 40-40S82.1 20 60 20zm0 72c-17.6 0-32-14.4-32-32s14.4-32 32-32 32 14.4 32 32-14.4 32-32 32z" fill="#e74c3c"/>
                    <path d="M65 45h-10v30h10V45zM65 80h-10v10h10V80z" fill="#e74c3c"/>
                </svg>
            </div>

            <h1 class="error-code">500</h1>
            <h2 class="error-title">服务器内部错误</h2>
            <p class="error-description">
                抱歉，服务器遇到了一个意外错误，无法完成您的请求。<br>
                我们的技术团队已经收到通知，正在努力修复这个问题。
            </p>

            <% if (errorMessage) { %>
            <div class="error-details">
                <div class="error-details-title">错误详情：</div>
                <div class="error-details-content"><%= errorMessage %></div>
            </div>
            <% } %>

            <div class="error-actions">
                <a href="<%= basePath %>/" class="btn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 3L2 10h3v7h4v-5h2v5h4v-7h3L10 3z" fill="currentColor"/>
                    </svg>
                    返回首页
                </a>
                <a href="javascript:location.reload()" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 10c0-3.9-3.1-7-7-7-2.1 0-3.9.9-5.2 2.3L3 3.5V9h5.5L6.4 6.9C7.3 5.7 8.6 5 10 5c2.8 0 5 2.2 5 5s-2.2 5-5 5c-1.9 0-3.6-1.1-4.4-2.7L3.5 13c1.2 2.3 3.6 3.9 6.5 3.9 3.9 0 7-3.1 7-7z" fill="currentColor"/>
                    </svg>
                    刷新页面
                </a>
            </div>
        </div>
    </div>
</body>
</html>
