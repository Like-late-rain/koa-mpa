<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        .error-container {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #e74c3c;
            margin: 0;
            line-height: 1;
        }
        .error-message {
            font-size: 28px;
            color: #2c3e50;
            margin: 20px 0;
        }
        .error-description {
            font-size: 16px;
            color: #7f8c8d;
            margin: 20px 0 40px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-secondary {
            background-color: #95a5a6;
        }
        .btn-secondary:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>Nest.js MPA</h1>
            <ul class="nav-links">
                <li><a href="<%= basePath %>/">首页</a></li>
                <li><a href="<%= basePath %>/form">表单</a></li>
                <li><a href="<%= basePath %>/about">关于</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="error-container">
                <h1 class="error-code">404</h1>
                <h2 class="error-message">页面未找到</h2>
                <p class="error-description">
                    抱歉，您访问的页面不存在。可能是页面已被删除，或者您输入的地址有误。
                </p>
                <div class="error-actions">
                    <a href="<%= basePath %>/" class="btn">返回首页</a>
                    <a href="javascript:history.back()" class="btn btn-secondary">返回上一页</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Nest.js MPA 学习项目</p>
    </footer>
</body>
</html>
