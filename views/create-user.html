<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %></title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/user.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <h1>Koa MPA</h1>
        <ul class="nav-links">
          <li><a href="/">首页</a></li>
          <li><a href="/users">用户列表</a></li>
          <li><a href="/users/create" class="active">创建用户</a></li>
          <li><a href="/form-data">表单数据</a></li>
          <li><a href="/github">GitHub 登录</a></li>
        </ul>
      </div>
    </nav>

    <main class="container">
      <div class="form-container">
        <h2>创建新用户</h2>

        <div id="alert-message" class="alert" style="display: none"></div>

        <form id="create-user-form">
          <div class="form-group">
            <label for="username">用户名 <span class="required">*</span></label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="请输入用户名"
              required
            />
            <span class="error-message" id="username-error"></span>
          </div>

          <div class="form-group">
            <label for="email">邮箱</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="请输入邮箱地址（可选）"
            />
          </div>

          <div class="form-group">
            <label for="name">姓名</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="请输入姓名（可选）"
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">
              创建用户
            </button>
            <a href="/users" class="btn btn-secondary">取消</a>
          </div>
        </form>

        <p style="margin-top: 20px; color: #666">
          提示：也可以通过 <a href="/github">GitHub Token 登录</a> 自动创建用户
        </p>
      </div>
    </main>

    <footer>
      <p>&copy; 2024 Koa MPA</p>
    </footer>

    <script>
      document
        .getElementById("create-user-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();
          const email = document.getElementById("email").value.trim();
          const name = document.getElementById("name").value.trim();
          const alertDiv = document.getElementById("alert-message");
          const submitBtn = document.getElementById("submit-btn");

          // 清除之前的错误
          alertDiv.style.display = "none";
          document.getElementById("username-error").textContent = "";

          // 验证
          if (!username) {
            document.getElementById("username-error").textContent =
              "用户名不能为空";
            return;
          }

          // 禁用按钮
          submitBtn.disabled = true;
          submitBtn.textContent = "创建中...";

          try {
            const response = await fetch("/users/create", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                username,
                email: email || null,
                name: name || null
              })
            });

            const data = await response.json();

            if (data.success) {
              alertDiv.className = "alert alert-success";
              alertDiv.textContent = "创建成功！正在跳转...";
              alertDiv.style.display = "block";

              setTimeout(() => {
                window.location.href = "/users";
              }, 1000);
            } else {
              alertDiv.className = "alert alert-error";
              alertDiv.textContent = data.message || "创建失败";
              alertDiv.style.display = "block";
              submitBtn.disabled = false;
              submitBtn.textContent = "创建用户";
            }
          } catch (err) {
            console.error(err);
            alertDiv.className = "alert alert-error";
            alertDiv.textContent = "请求失败，请重试";
            alertDiv.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = "创建用户";
          }
        });
    </script>
  </body>
</html>
