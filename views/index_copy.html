<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <script src="scripts/index.js"></script>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>Nest.js MPA</h1>
            <ul class="nav-links">
                <li><a href="/" class="active">首页</a></li>
                <li><a href="/form">表单</a></li>
                <li><a href="/about">关于</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="hero">
            <!-- {{!-- <h2>{{message}}</h2>
            <p>{{description}}</p> --}} -->
            <%= data %>
            <div class="features">
                <div class="feature-card">
                    <h3>🚀 简单易用</h3>
                    <p>Nest.js 提供了清晰的项目结构和强大的 CLI 工具</p>
                </div>
                <div class="feature-card">
                    <h3>📦 模块化</h3>
                    <p>通过模块、控制器和服务实现代码组织</p>
                </div>
                <div class="feature-card">
                    <h3>🎨 灵活</h3>
                    <p>支持多种模板引擎，构建 MPA 或 API 都很方便</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Nest.js MPA 学习项目</p>
    </footer>
</body>
</html>
