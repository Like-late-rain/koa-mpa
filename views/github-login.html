<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= title %></title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/user.css">
    <style>
        .github-info {
            background: #f6f8fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .github-info.show {
            display: block;
        }
        .github-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
        }
        .github-profile {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .github-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #0366d6;
        }
        .stat-label {
            font-size: 0.9em;
            color: #666;
        }
        .token-hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
        }
        .token-hint a {
            color: #0366d6;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>Koa MPA</h1>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/users">用户列表</a></li>
                <li><a href="/form-data">表单数据</a></li>
                <li><a href="/github" class="active">GitHub 登录</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <h2>GitHub Token 登录</h2>

            <div id="alert-message" class="alert" style="display: none;"></div>

            <form id="github-form">
                <div class="form-group">
                    <label for="token">GitHub Personal Access Token <span class="required">*</span></label>
                    <input
                        type="password"
                        id="token"
                        name="token"
                        placeholder="请输入你的 GitHub Token"
                        required
                    >
                    <span class="error-message" id="token-error"></span>
                    <p class="token-hint">
                        没有 Token？
                        <a href="https://github.com/settings/tokens/new" target="_blank">点击这里创建</a>
                        （需要勾选 user 权限）
                    </p>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="fetch-btn" onclick="fetchGitHubInfo()">
                        获取用户信息
                    </button>
                    <button type="submit" class="btn btn-primary" id="login-btn">
                        登录/注册
                    </button>
                </div>
            </form>

            <div id="github-info" class="github-info">
                <div class="github-profile">
                    <img id="github-avatar" class="github-avatar" src="" alt="Avatar">
                    <div>
                        <h3 id="github-name"></h3>
                        <p id="github-login" style="color: #666;"></p>
                        <p id="github-bio" style="font-style: italic;"></p>
                    </div>
                </div>
                <div class="github-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="github-repos">0</div>
                        <div class="stat-label">Repos</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="github-followers">0</div>
                        <div class="stat-label">Followers</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="github-following">0</div>
                        <div class="stat-label">Following</div>
                    </div>
                </div>
                <p style="margin-top: 15px;">
                    <a id="github-profile-link" href="#" target="_blank">查看 GitHub 主页</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Koa MPA</p>
    </footer>

    <script>
        async function fetchGitHubInfo() {
            const token = document.getElementById('token').value.trim();
            const alertDiv = document.getElementById('alert-message');
            const fetchBtn = document.getElementById('fetch-btn');
            const infoDiv = document.getElementById('github-info');

            if (!token) {
                document.getElementById('token-error').textContent = 'Token 不能为空';
                return;
            }

            document.getElementById('token-error').textContent = '';
            alertDiv.style.display = 'none';
            infoDiv.classList.remove('show');

            fetchBtn.disabled = true;
            fetchBtn.textContent = '获取中...';

            try {
                const response = await fetch('/github/user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (data.success) {
                    // 显示用户信息
                    document.getElementById('github-avatar').src = data.data.avatarUrl;
                    document.getElementById('github-name').textContent = data.data.name || data.data.login;
                    document.getElementById('github-login').textContent = '@' + data.data.login;
                    document.getElementById('github-bio').textContent = data.data.bio || '';
                    document.getElementById('github-repos').textContent = data.data.publicRepos;
                    document.getElementById('github-followers').textContent = data.data.followers;
                    document.getElementById('github-following').textContent = data.data.following;
                    document.getElementById('github-profile-link').href = data.data.profileUrl;

                    infoDiv.classList.add('show');

                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = '获取成功！';
                    alertDiv.style.display = 'block';
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = data.message || '获取失败';
                    alertDiv.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = '请求失败，请重试';
                alertDiv.style.display = 'block';
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.textContent = '获取用户信息';
            }
        }

        document.getElementById('github-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const token = document.getElementById('token').value.trim();
            const alertDiv = document.getElementById('alert-message');
            const loginBtn = document.getElementById('login-btn');

            if (!token) {
                document.getElementById('token-error').textContent = 'Token 不能为空';
                return;
            }

            document.getElementById('token-error').textContent = '';
            alertDiv.style.display = 'none';

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const response = await fetch('/github/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (data.success) {
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = data.message + '！欢迎 ' + data.data.user.username + '，正在跳转...';
                    alertDiv.style.display = 'block';

                    // 跳转到用户列表
                    setTimeout(() => {
                        window.location.href = '/users';
                    }, 1500);
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = data.message || '登录失败';
                    alertDiv.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = '请求失败，请重试';
                alertDiv.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录/注册';
            }
        });
    </script>
</body>
</html>
